<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="needleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="needleSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" stroke="url(#amberGold)" stroke-width="14" />
  
  <!-- Outer Compass Markings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="4 16" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#amberGold)" stroke-width="2" opacity="0.6" />

  <!-- Cardinal Direction Letters -->
  <text x="256" y="95" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle">K</text>
  <text x="256" y="445" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#94a3b8" text-anchor="middle">G</text>
  <text x="435" y="267" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#94a3b8" text-anchor="middle">D</text>
  <text x="77" y="267" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#94a3b8" text-anchor="middle">B</text>

  <!-- Compass Star Needle -->
  <!-- North Red Needle -->
  <polygon points="256,105 285,256 256,235" fill="url(#needleRed)" />
  <polygon points="256,105 227,256 256,235" fill="#f87171" />

  <!-- South Silver Needle -->
  <polygon points="256,407 285,256 256,277" fill="url(#needleSilver)" />
  <polygon points="256,407 227,256 256,277" fill="#cbd5e1" />

  <!-- East Needle -->
  <polygon points="407,256 256,285 277,256" fill="url(#amberGold)" opacity="0.8" />
  <polygon points="407,256 256,227 277,256" fill="#fef08a" opacity="0.8" />

  <!-- West Needle -->
  <polygon points="105,256 256,285 235,256" fill="url(#amberGold)" opacity="0.8" />
  <polygon points="105,256 256,227 235,256" fill="#fef08a" opacity="0.8" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="22" fill="#0f172a" stroke="url(#amberGold)" stroke-width="6" />
  <circle cx="256" cy="256" r="8" fill="#fbbf24" />
</svg>
